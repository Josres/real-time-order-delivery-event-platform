services:
  redpanda:
    # Allow overriding the image via env var (useful if Docker Hub requires auth)
    image: ${REDPANDA_IMAGE:-docker.redpanda.com/redpandadata/redpanda:v23.3.3}
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:29092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18083
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "29092:29092"
      - "18082:18082"
      - "18083:18083"
      - "19644:9644"
    environment:
      - REDPANDA_AUTO_CREATE_TOPICS=true

  # Redpanda Console UI for viewing topics, messages, schemas, and consumer groups
  redpanda-console:
    image: redpandadata/console:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: "http://schema-registry:8081"
    depends_on:
      - redpanda
      - schema-registry

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "${SCHEMA_REGISTRY_BOOTSTRAP:-PLAINTEXT://redpanda:9092}"
      SCHEMA_REGISTRY_HOST_NAME: "schema-registry"
    ports:
      - "18081:8081"
    depends_on:
      - redpanda

  # Alternative Kafka backend (profile; use with: `docker compose --profile kafka up -d`)
  zookeeper:
    image: soldevelo/zookeeper:latest
    profiles: ["kafka"]
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    image: soldevelo/kafka:latest
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Hive Metastore for Iceberg catalog
  hive-metastore:
    build: ./hive
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: derby
      HIVE_AUX_JARS_PATH: /opt/hive/lib/
    depends_on:
      - minio
    volumes:
      - hive_metastore_data:/opt/hive/data/warehouse

  # Trino for SQL queries on Iceberg tables (CPU-compatible version)
  trino:
    image: trinodb/trino:417
    ports:
      - "8082:8080"
    depends_on:
      - minio
      - hive-metastore
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/config.properties:/etc/trino/config.properties:ro

  # Jupyter notebooks with DuckDB for analytics
  duckdb:
    image: jupyter/base-notebook:latest
    ports:
      - "8888:8888"
    depends_on:
      - minio
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - JUPYTER_ENABLE_LAB=yes
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''
    volumes:
      - duckdb_data:/home/jovyan/work

  grafana:
    image: grafana/grafana:9.5.0
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - ../dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DASHBOARDS_JSON_ENABLED=true
      - GF_DASHBOARDS_JSON_PATH=/var/lib/grafana/dashboards

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    depends_on:
      - alertmanager

  # Alertmanager for alert routing and notifications
  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'


  # Flink jobmanager and taskmanager (lightweight)
  flink-jobmanager:
    build: ./flink
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
        classloader.resolve-order: parent-first
    depends_on:
      - hive-metastore
      - redpanda
    volumes:
      - ../flink/jobs:/opt/flink/jobs:ro

  flink-taskmanager:
    build: ./flink
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
        classloader.resolve-order: parent-first
        taskmanager.numberOfTaskSlots: 6
    volumes:
      - ../flink/jobs:/opt/flink/jobs:ro

  # Airflow for DAG orchestration (backfills, data quality)
  # Using SequentialExecutor for SQLite compatibility
  airflow-init:
    image: apache/airflow:2.7.3-python3.10
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin || true
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__FERNET_KEY=81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs=
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__SECRET_KEY=supersecretkey
    volumes:
      - airflow_data:/opt/airflow
      - ../airflow/dags:/opt/airflow/dags:ro

  airflow-webserver:
    image: apache/airflow:2.7.3-python3.10
    command: webserver
    ports:
      - "8085:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__FERNET_KEY=81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs=
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__SECRET_KEY=supersecretkey
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
    volumes:
      - airflow_data:/opt/airflow
      - ../airflow/dags:/opt/airflow/dags:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  airflow-scheduler:
    image: apache/airflow:2.7.3-python3.10
    command: scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__FERNET_KEY=81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs=
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__SECRET_KEY=supersecretkey
    volumes:
      - airflow_data:/opt/airflow
      - ../airflow/dags:/opt/airflow/dags:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-init:
        condition: service_completed_successfully

networks:
  default:
    name: rtod-network

volumes:
  minio_data:
  duckdb_data:
  prometheus_data:
  hive_metastore_data:
  airflow_data:
